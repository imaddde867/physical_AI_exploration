[platformio]
default_envs = esp32s3_n16r8_usb

[env:esp32s3_n16r8_usb]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Generic DevKitC defaults to N8; selected board is N16R8.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:scripts/embed_face.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GC9A01A @ 1.2.0
    adafruit/Adafruit GFX Library @ 1.12.6
    bblanchon/ArduinoJson @ 7.4.3

[env:esp32s3_n16r8_uart]
extends = env:esp32s3_n16r8_usb
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
