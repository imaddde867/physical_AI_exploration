; Deliberately separate from firmware/: never flash the GC9A01 image to V2.
[platformio]
default_envs = waveshare_amoled_v2

[env:waveshare_amoled_v2]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = pre:scripts/embed_face.py
