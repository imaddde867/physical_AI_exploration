name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit tests (no CAD runtime)
        run: python -m unittest discover -s tests -v

  cad-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CAD geometry kernel
        run: python -m pip install build123d==0.13.0
      - name: Solid overlap and clearance regression tests
        run: python -m unittest discover -s tests -p 'test_mount_geometry.py' -v
      - name: Generate nominal CAD geometry
        working-directory: cad/slab/src
        run: python mount.py
      - name: Export nominal STL assembly, removing stale parts
        working-directory: cad/slab/src
        run: |
          mkdir -p ../tmp/parts
          printf 'stale model' > ../tmp/parts/old_pod.stl
          python export_parts.py
          test ! -e ../tmp/parts/old_pod.stl
          test -n "$(find ../tmp/parts -name '*.stl' -print -quit)"
