# One-time administrative operation. Delete this workflow after its first run.
name: Retire five superseded branches

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-stale-branches.yml']

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Verify closed PRs and exact old branch heads before deleting
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected_sha=(
            ["audit/2026-10-26-build-readiness"]="b5e54f69ce5669acf71cb8e4c1b8f1e7e8633172"
            ["design/character-identity-exploration"]="433a98dabb31f2f5a2fc30005c92bbfdb228d449"
            ["feat/approved-single-face"]="25bce6dbd210c6a8ab5611033b1c459aa318c7b4"
            ["feat/round-ips-color-face"]="26e24e7f0b92549d86b36406c4761509c373b927"
            ["review/final-clone-readiness-2026-10-26"]="aa325f0e33ac99e81bcf71b3f7635e5271740a08"
          )
          declare -A pull_number=(
            ["audit/2026-10-26-build-readiness"]="3"
            ["design/character-identity-exploration"]="6"
            ["feat/approved-single-face"]="7"
            ["feat/round-ips-color-face"]="4"
            ["review/final-clone-readiness-2026-10-26"]="5"
          )
          if [[ "${#expected_sha[@]}" -ne 5 ]]; then exit 1; fi
          for branch in "${!expected_sha[@]}"; do
            pr_state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${pull_number[$branch]}" --jq '.state')
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
            if [[ "$pr_state" != "closed" || "$current_sha" != "${expected_sha[$branch]}" ]]; then
              echo "::error::Ref or PR changed: $branch. Refusing branch deletion."
              exit 1
            fi
            echo "Verified: $branch at $current_sha (PR ${pull_number[$branch]} closed)"
          done
          for branch in "${!expected_sha[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted: $branch"
          done
