name: ESP32 firmware build
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'platformio==6.2.0'
      - run: pio run -d firmware -e esp32s3_n16r8_usb
      - run: pio run -d firmware -e esp32s3_n16r8_uart
