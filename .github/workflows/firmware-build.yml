name: ESP32 firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'platformio==6.2.0'
      - run: pio run -d firmware -e esp32s3_n16r8_usb
      - run: pio run -d firmware -e esp32s3_n16r8_uart
      - run: python -m platformio run -d firmware-v2 -e waveshare_amoled_v2
